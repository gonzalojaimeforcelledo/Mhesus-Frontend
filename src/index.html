<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>MHESUS — Sistema Interno</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <script>
    // Aplica el tema guardado antes de pintar, para evitar un parpadeo del tema incorrecto.
    (function () {
      try {
        var guardado = localStorage.getItem('mhesus:tema');
        var oscuro = guardado ? guardado === 'oscuro' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (oscuro) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
</head>
<body class="font-body bg-ink-50 text-ink-900">
  <app-root></app-root>
</body>
</html>
